<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Veronica · Fight Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0A0F'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' fill='%239D6BFF'%3EV%3C/text%3E%3C/svg%3E">
<style>
/* ===== Theme tokens ===== */
:root{
  --bg:#F6F5F9;--surface:#FFFFFF;--surface2:#F1EFF7;--line:#E4E0EE;--text:#16141D;--muted:#686379;
  --accent:#6B33E8;--accent2:#8C5CF5;--accentSoft:rgba(107,51,232,.10);--onAccent:#FFFFFF;
  --gold:#B07D06;--goldSoft:rgba(176,125,6,.12);--green:#12985A;--greenSoft:rgba(18,152,90,.12);
  --orange:#C96A12;--orangeSoft:rgba(201,106,18,.12);--red:#D33445;--redSoft:rgba(211,52,69,.12);
  --fig:#1E1B27;--figFar:#B4AEC4;--shadow:0 1px 2px rgba(20,16,35,.05),0 6px 22px rgba(20,16,35,.06);
  --heroBg:#0B0A0F;--heroText:#F4F1FA;--heroMuted:#A9A3BA;--heroAccent:#A57BFF;
  --radius:18px;--tabH:66px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111017;--surface:#1A1922;--surface2:#22202C;--line:#2E2B3A;--text:#ECE9F3;--muted:#A19CB2;
    --accent:#A57BFF;--accent2:#C2A6FF;--accentSoft:rgba(165,123,255,.14);--onAccent:#110E19;
    --gold:#F0C24F;--goldSoft:rgba(240,194,79,.14);--green:#40D493;--greenSoft:rgba(64,212,147,.13);
    --orange:#FFA24C;--orangeSoft:rgba(255,162,76,.14);--red:#FF6575;--redSoft:rgba(255,101,117,.14);
    --fig:#E9E5F2;--figFar:#5E5970;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111017;--surface:#1A1922;--surface2:#22202C;--line:#2E2B3A;--text:#ECE9F3;--muted:#A19CB2;
  --accent:#A57BFF;--accent2:#C2A6FF;--accentSoft:rgba(165,123,255,.14);--onAccent:#110E19;
  --gold:#F0C24F;--goldSoft:rgba(240,194,79,.14);--green:#40D493;--greenSoft:rgba(64,212,147,.13);
  --orange:#FFA24C;--orangeSoft:rgba(255,162,76,.14);--red:#FF6575;--redSoft:rgba(255,101,117,.14);
  --fig:#E9E5F2;--figFar:#5E5970;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.disp{font-family:Oswald,Impact,"Arial Narrow",sans-serif;letter-spacing:.02em;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:13px}.tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}

/* ===== App shell ===== */
#app{max-width:520px;margin:0 auto;padding:0 14px calc(var(--tabH) + 28px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 8px;gap:8px}
.brand{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.14em;font-size:12px;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--accent);font-weight:700}
.iconbtn{height:36px;min-width:36px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}
.iconbtn svg{width:18px;height:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabH)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:0}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== Cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-family:Oswald,sans-serif;font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.sec-title{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.12em;font-size:12.5px;color:var(--muted);text-transform:uppercase;margin:22px 4px 6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.pill.acc{background:var(--accentSoft);border-color:transparent;color:var(--accent)}
.pill.gold{background:var(--goldSoft);border-color:transparent;color:var(--gold)}
.pill.green{background:var(--greenSoft);border-color:transparent;color:var(--green)}
.pill.orange{background:var(--orangeSoft);border-color:transparent;color:var(--orange)}
.pill.red{background:var(--redSoft);border-color:transparent;color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.dark{background:#0B0A0F;border-color:#0B0A0F;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1;min-width:0}
.why{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;vertical-align:middle}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:13.5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;width:100%;min-width:0;font-size:16px}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hr{height:1px;background:var(--line);margin:12px 0}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(-135deg)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border:0;border-radius:10px;background:none;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;border-radius:24px;background:var(--heroBg);color:var(--heroText);padding:22px 18px 18px;margin-top:4px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:120%;background:radial-gradient(closest-side,rgba(157,107,255,.38),transparent 70%);z-index:-1;animation:spot 9s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px);z-index:-1;pointer-events:none}
@keyframes spot{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.hero .kicker{font-family:Oswald,sans-serif;letter-spacing:.3em;font-size:11.5px;color:var(--heroMuted);text-transform:uppercase}
.hero .name{font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(54px,17vw,84px);line-height:.92;letter-spacing:.02em;margin:6px 0 2px;background:linear-gradient(180deg,#fff 30%,#CDB8FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .tag{font-family:Oswald,sans-serif;font-size:21px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hero .rot{color:var(--heroAccent);display:inline-block;min-width:4ch}
.rot.swap{animation:rotIn .5s ease}
@keyframes rotIn{from{opacity:0;transform:translateY(60%) skewX(-8deg)}to{opacity:1;transform:none}}
.weekbar{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:14px}
.weekbar i{height:8px;border-radius:3px;background:rgba(255,255,255,.12)}
.weekbar i.done{background:var(--heroAccent)}
.weekbar i.now{background:#fff;box-shadow:0 0 0 2px rgba(165,123,255,.6)}
.weekbar i.fn{outline:1px solid rgba(240,194,79,.75);outline-offset:1px}
.ringhero{padding:18px 14px 16px}
.ringhero .kicker{margin-bottom:4px}
.arena{display:block;width:calc(100% + 12px);margin:0 -6px;height:auto;overflow:visible}
.arena .flashdot{fill:#fff;opacity:0;animation:camflash 6s infinite}
@keyframes camflash{0%,90%,100%{opacity:0}92%{opacity:1}95%{opacity:.2}}
.arena .beam{transform-origin:50% 0;animation:beam 7s ease-in-out infinite alternate}
@keyframes beam{from{transform:skewX(-6deg);opacity:.8}to{transform:skewX(6deg);opacity:1}}
.ringhero .tag{margin-top:10px}
.hero .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--heroMuted);font-weight:600;letter-spacing:.04em}

/* ===== Fighter card ===== */
.fcard{position:relative;border-radius:22px;padding:16px;overflow:hidden;background:linear-gradient(160deg,#16131F 0%,#0B0A0F 70%);color:#F4F1FA;border:1px solid #2A2536;box-shadow:var(--shadow)}
.fcard .tier{font-family:Oswald,sans-serif;letter-spacing:.24em;font-size:11.5px;text-transform:uppercase;color:#CDB8FF}
.fcard .ovr{font-family:Oswald,sans-serif;font-size:64px;line-height:.9;font-weight:700}
.fcard .ovr small{font-size:14px;letter-spacing:.2em;color:#A9A3BA;display:block;font-weight:600}
.fcard .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.fcard .st{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer}
.fcard .st b{display:block;font-family:Oswald,sans-serif;font-size:22px;line-height:1.1}
.fcard .st span{font-size:9.5px;letter-spacing:.12em;color:#A9A3BA;font-weight:700}
.fcard .st .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin:6px 8px 0;overflow:hidden}
.fcard .st .bar i{display:block;height:100%;background:#A57BFF}
.type{min-height:22px;margin-top:12px;font-weight:600;color:#E5C46A;font-size:14.5px}
.type::after{content:"▍";animation:blink 1s steps(1) infinite;color:#E5C46A;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.coachline{margin-top:6px;font-size:12.5px;color:#A9A3BA;font-style:italic;min-height:18px}
.fcard .ring{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;border:16px solid rgba(165,123,255,.10)}

/* ===== Record / belt / wraps ===== */
.record{display:flex;align-items:stretch;gap:10px}
.rec-box{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.rec-box b{display:block;font-family:Oswald,sans-serif;font-size:30px;line-height:1.05}
.rec-box span{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--muted);text-transform:uppercase}
.belt svg{width:100%;height:auto;display:block}
.gemtap{cursor:pointer}

/* ===== Next up ===== */
.next{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface);box-shadow:var(--shadow);margin:12px 0;position:relative;overflow:hidden}
.next .big{font-family:Oswald,sans-serif;font-size:26px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.next::after{content:"";position:absolute;right:-20px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:var(--accentSoft)}
.next>*{position:relative;z-index:1}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.sched div{border-radius:10px;padding:6px 0;text-align:center;font-size:10.5px;font-weight:700;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.sched div b{display:block;font-size:13px;color:var(--text);margin-top:1px}
.sched div.home{background:var(--accentSoft);border-color:transparent}
.sched div.home b{color:var(--accent)}
.sched div.ring b{color:var(--gold)}
.sched div.today{outline:2px solid var(--accent);outline-offset:-1px}
.sched div.did::after{content:"✓";display:block;color:var(--green);font-size:11px;line-height:1}

/* ===== Exercise / session ===== */
.sess-head{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sess-head .timer{font-family:Oswald,sans-serif;font-size:22px;font-weight:600;min-width:64px;text-align:right}
.blockhead{display:flex;align-items:center;gap:8px;margin:20px 2px 4px}
.blockhead .lt{width:30px;height:30px;border-radius:9px;background:#0B0A0F;color:#fff;font-family:Oswald,sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.blockhead .tx{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:8px 0;box-shadow:var(--shadow)}
.ex.done{border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
.ex.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft),var(--shadow)}
.ex .tt{display:flex;align-items:flex-start;gap:8px}
.ex .code{font-family:Oswald,sans-serif;font-weight:700;color:var(--accent);font-size:15px;min-width:24px;padding-top:1px}
.ex .nm{font-weight:800;font-size:16px;line-height:1.25}
.ex .rx{font-size:13px;color:var(--muted);margin-top:2px}
.ex .info{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ex .line{font-size:13px;display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.ex .line .ic{flex:none;width:18px;text-align:center}
.smart{background:var(--accentSoft);border-radius:11px;padding:8px 10px;font-size:13px;font-weight:600}
.ghostl{background:var(--surface2);border:1px dashed var(--line);border-radius:11px;padding:8px 10px;font-size:13px}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:6px;align-items:center}
.setrow.uni{grid-template-columns:26px 1fr .8fr .8fr 46px}
.setrow .n{font-family:Oswald,sans-serif;font-weight:600;color:var(--muted);text-align:center}
.setrow .inp{height:44px;text-align:center;padding:0 4px;font-weight:700}
.setrow select.inp{text-align:left;padding:0 6px;font-size:14px;font-weight:600}
.setrow .inp::placeholder{font-size:12.5px;font-weight:600;color:var(--muted);opacity:.8}
.setrow .ok{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:800;font-size:18px;color:var(--muted)}
.setrow.done .ok{background:var(--green);border-color:var(--green);color:#fff}
.setrow.done .inp{background:var(--greenSoft);border-color:transparent}
.setrow.pr .ok{background:var(--gold);border-color:var(--gold);color:#1a1300}
.setrow .unit{position:relative}
.setrow .unit::after{content:attr(data-u);position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--muted);pointer-events:none;font-weight:600}
.sethdr{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:6px;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.sethdr.uni{grid-template-columns:26px 1fr .8fr .8fr 46px}
.rest-note{font-size:11.5px;color:var(--muted);text-align:right;margin-top:-2px}
.exbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.exbar .btn{height:34px;font-size:12.5px;padding:0 10px;border-radius:10px}
.demo{margin-top:10px;background:var(--surface2);border-radius:14px;padding:6px;display:flex;align-items:center;justify-content:center}
.demo svg{width:100%;max-width:300px;height:auto}
.prep-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prep-item:last-child{border-bottom:0}
.prep-item .chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:none;flex:none;font-weight:800;color:transparent}
.prep-item.on .chk{background:var(--green);border-color:var(--green);color:#fff}
.prep-item .mini{width:64px;height:54px;flex:none;background:var(--surface2);border-radius:10px;overflow:hidden}
.prep-item .mini svg{width:100%;height:100%}
.rir .chip{height:34px;min-width:40px;padding:0 8px}
.levelchip{font-size:11.5px}
.banner{border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:600;margin:10px 0;display:flex;gap:10px;align-items:flex-start}
.banner.acc{background:var(--accentSoft);color:var(--text)}
.banner.orange{background:var(--orangeSoft)}
.banner.gold{background:var(--goldSoft)}

/* ===== Sheets / modals ===== */
.scrim{position:fixed;inset:0;background:rgba(8,6,14,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border:1px solid var(--line);border-bottom:0}
.sheet h2{margin:0 0 4px;font-family:Oswald,sans-serif;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:22px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
.q{margin:14px 0 6px;font-weight:700;font-size:14px}

/* The Corner */
.corner{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;pointer-events:none}
.corner .in{pointer-events:auto;width:100%;max-width:520px;margin:0 8px calc(var(--tabH) + 8px + env(safe-area-inset-bottom));background:#0B0A0F;color:#F4F1FA;border-radius:22px;padding:14px;border:1px solid #2A2536;box-shadow:0 18px 50px rgba(0,0,0,.45);display:flex;gap:14px;align-items:center;animation:toastIn .25s ease}
.corner .clock{position:relative;width:84px;height:84px;flex:none}
.corner .clock svg{width:84px;height:84px;transform:rotate(-90deg)}
.corner .clock b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Oswald,sans-serif;font-size:26px}
.corner .lab{font-family:Oswald,sans-serif;letter-spacing:.22em;font-size:12px;color:#CDB8FF}
.corner .tip{font-size:13.5px;line-height:1.35;margin-top:3px}
.corner .nx{font-size:12px;color:#A9A3BA;margin-top:4px}
.corner .btn{height:32px;font-size:12.5px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#fff}

/* Fullscreen overlays */
.full{position:fixed;inset:0;z-index:100;background:#0B0A0F;color:#F4F1FA;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
.full .btns .btn{white-space:normal;font-size:14px;line-height:1.2}
.full .x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px}
.full .huge{font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(64px,22vw,120px);line-height:.9;letter-spacing:.02em}
.ko .huge{color:#F0C24F;text-shadow:0 0 40px rgba(240,194,79,.45);animation:koIn .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes koIn{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.full .sub{font-size:15px;color:#CFC9DE;max-width:340px;margin-top:10px}
.full .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:380px;margin:20px 0}
.full .stat3 div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 4px}
.full .stat3 b{display:block;font-family:Oswald,sans-serif;font-size:28px}
.full .stat3 span{font-size:10.5px;letter-spacing:.14em;color:#A9A3BA;font-weight:700}
.spark{position:absolute;width:6px;height:14px;border-radius:2px;top:-20px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* Combo caller */
.combo{font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(44px,15vw,84px);line-height:1;letter-spacing:.03em;min-height:1.1em}
.combo-sub{font-size:16px;color:#CDB8FF;margin-top:8px;min-height:22px;font-weight:600}
.flash{animation:flash .35s ease}
@keyframes flash{from{transform:scale(1.15);color:#fff}to{transform:none}}

/* Charts */
canvas.chart{width:100%;height:180px;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:Oswald,sans-serif;font-size:28px;line-height:1.05}
.kpi span{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.vs{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:13.5px;align-items:center}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}.flat{color:var(--muted);font-weight:700}
.prwall .list-row b{font-family:Oswald,sans-serif;font-size:17px}
.gauge svg{width:100%;max-width:330px;display:block;margin:0 auto}
.ringsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.ringsrow svg{width:84px;height:84px}
.ringsrow .lb{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ringsrow .vl{font-size:13px;font-weight:700}
.plate{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.plate:last-child{border-bottom:0}
.plate svg{width:78px;height:78px;flex:none}
.plate .t{font-weight:700;font-size:14px}
.plate .d{font-size:12.5px;color:var(--muted);line-height:1.35}
.fooditem{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.fooditem:last-child{border-bottom:0}
.code-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:110px;overflow:auto}
.poster-prev{width:100%;border-radius:14px;display:block;border:1px solid var(--line)}

/* stick figure */
.fgnd{stroke:var(--line);stroke-width:1.2}
.fprop{fill:var(--surface);stroke:var(--figFar);stroke-width:1.2}
.fnear{stroke:var(--fig);stroke-width:3.4}
.ffar{stroke:var(--figFar);stroke-width:3.4}
.fhead{fill:var(--surface2);stroke:var(--fig);stroke-width:2.6}
.fdb{fill:var(--accent)}
.fband{stroke:var(--accent);stroke-width:1.6;fill:none;stroke-dasharray:3 2}
.full,.fcard,.hero{--fig:#ECE8F5;--figFar:#5E5970;--surface2:#1C1A26;--surface:#15131D;--line:#2C2838;--accent:#A57BFF}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .type::after{display:none}
}
@media (max-width:370px){

  .fcard .st span{font-size:8.5px;letter-spacing:.08em}

  .btn{padding:0 12px}
}

function tx(a,v){let s=Array.isArray(a)?(L()==='ua'?a[1]:a[0]):(a&&a[L()])||'';if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s}

/* ================= CAMP CALENDAR ================= */
function weekOf(d){return Math.floor(daysBetween(S.profile.start,d)/7)+1}
function curWeek(){return weekOf(today())}
function homeKinds(k){return k==='A'||k==='B'||k==='fn'||k==='wi'}
function sessionsSorted(){return [...S.sessions].sort((a,b)=>a.d===b.d?a.ts-b.ts:a.d<b.d?-1:1)}
function weekStats(w){
  let home=0,ring=0;
  for(const s of S.sessions){if(weekOf(s.d)!==w)continue;if(homeKinds(s.kind))home++;else if(s.kind==='ring')ring++}
  return {home,ring,counted:home>=2||home+ring>=3};
}
function wrapsCount(){let n=0;const cw=Math.min(curWeek(),12);for(let w=1;w<=cw;w++)if(weekStats(w).counted)n++;return n}
function bestWrapStreak(){let best=0,cur=0;const cw=Math.min(curWeek(),12);for(let w=1;w<=cw;w++){if(weekStats(w).counted){cur++;best=Math.max(best,cur)}else if(w<cw)cur=0}return best}

/* ================= SCORING ================= */
function setReps(ex,st){if(!st)return 0;return ex.uni?Math.min(+st.rl||0,+st.rr||0):(+st.r||0)}
function effLoad(id,w){const ex=EX[id];return (+w||0)+(ex&&ex.zeroOk?15:0)}
function setScore(id,st,lvl){
  const ex=EX[id];if(!ex||!st)return 0;const reps=setReps(ex,st);if(!reps)return 0;const L=1+0.06*(lvl||0);
  if(ex.type==='db')return effLoad(id,st.w)*(1+reps/30)*L;
  if(ex.type==='band')return ((+st.b||0)+1)*5*(1+reps/30)*L;
  return reps;
}
function exSessionBest(id,exd){let b=0,bs=null;for(const st of (exd.sets||[])){if(!st.done)continue;const v=setScore(id,st,exd.lvl);if(v>b){b=v;bs=st}}return {v:b,set:bs}}
function exHistory(id,excludeId){
  const out=[];for(const s of sessionsSorted()){if(s.id===excludeId)continue;const e=s.ex&&s.ex[id];if(!e)continue;const b=exSessionBest(id,e);if(b.v>0)out.push({s,e,best:b.v,set:b.set})}return out;
}
function bestScore(id,excludeId){let m=0;for(const h of exHistory(id,excludeId))m=Math.max(m,h.best);return m}
function lastOf(id,excludeId){const h=exHistory(id,excludeId);return h.length?h[h.length-1]:null}
function fmtSet(id,st){const ex=EX[id];if(!st)return'';const reps=ex.uni?`${st.rl||0}/${st.rr||0}`:(st.r||0);
  if(ex.type==='db')return `${+st.w||0} ${t('kg')} × ${reps}`;
  if(ex.type==='band')return `${tx(BANDS[ex.band][+st.b||0])} × ${reps}`;
  if(ex.type==='time')return `${reps} ${t('sec')}`;return `${reps}`;
}
function fmtSets(id,exd){const done=(exd.sets||[]).filter(s=>s.done);if(!done.length)return'';const ex=EX[id];
  if(ex.type==='db'){const ws=[...new Set(done.map(s=>+s.w||0))];if(ws.length===1)return `${ws[0]} ${t('kg')} × `+done.map(s=>ex.uni?`${s.rl||0}/${s.rr||0}`:s.r).join(', ')}
  if(ex.type==='band'){const bs=[...new Set(done.map(s=>+s.b||0))];if(bs.length===1)return `${tx(BANDS[ex.band][bs[0]])} × `+done.map(s=>ex.uni?`${s.rl||0}/${s.rr||0}`:s.r).join(', ')}
  if(ex.type==='bw'||ex.type==='time')return done.map(s=>ex.uni?`${s.rl||0}/${s.rr||0}`:s.r).join(', ')+(ex.type==='time'?' '+t('sec'):'');
  return done.map(s=>fmtSet(id,s)).join(', ');
}
function totalKOs(){return S.sessions.reduce((a,s)=>a+(s.prs||0),0)}
function hardSets(s){let n=0;for(const id in (s.ex||{}))n+=(s.ex[id].sets||[]).filter(x=>x.done).length;return n}
function gluteSets(s){let n=0;for(const id in (s.ex||{})){if(EX[id]&&EX[id].glute)n+=(s.ex[id].sets||[]).filter(x=>x.done).length}return n}

/* ================= RATINGS ================= */
function computeRatings(){
  const R={power:null,shape:null,kick:null,engine:null,grit:null,info:{}};
  // POWER
  const imps=[];let baselined=false;const pw=[];
  for(const id in EX){if(!EX[id].fam)continue;const h=exHistory(id);if(!h.length)continue;baselined=true;
    if(h.length>=2){const first=h[0].best;const best=Math.max(...h.slice(1).map(x=>x.best));const imp=best/first-1;imps.push(imp);pw.push([id,imp])}else pw.push([id,null])}
  if(baselined){const avg=imps.length?imps.reduce((a,b)=>a+b,0)/imps.length:0;R.power=Math.round(20+80*clamp(avg/0.40,0,1));R.info.power=pw}
  // SHAPE
  const ms=[...S.meas].filter(m=>m.waist&&m.hips).sort((a,b)=>a.d<b.d?-1:1);
  if(ms.length){const a=ms[0],b=ms[ms.length-1];const whr0=a.waist/a.hips,whr=b.waist/b.hips;
    const p=.5*clamp((whr0-whr)/0.04,0,1)+.25*clamp((b.hips-a.hips)/3,0,1)+.25*clamp((a.waist-b.waist)/4,0,1);
    R.shape=Math.round(20+80*p);R.info.shape={whr0,whr,dh:b.hips-a.hips,dw:b.waist-a.waist}}
  // KICK
  const kk=[...S.kick].sort((a,b)=>a.d<b.d?-1:1);
  if(kk.length){const k=kk[kk.length-1];const avg=(k.l+k.r)/2;const mx=Math.max(k.l,k.r)||1;
    R.kick=Math.round(Math.min(85,avg/30*85)+15*(1-Math.abs(k.l-k.r)/mx));R.info.kick=k}
  // ENGINE
  const rings=S.sessions.filter(s=>s.kind==='ring');
  if(rings.length){const from=addDays(today(),-27);const n=rings.filter(s=>s.d>=from).length;R.engine=Math.round(clamp(n/8,0,1)*100);R.info.engine=n}
  // GRIT
  if(S.sessions.length){R.grit=Math.round(clamp(S.sessions.length/48,0,1)*100);R.info.grit=S.sessions.length}
  // never down
  for(const k of ['power','shape','kick','engine','grit']){if(R[k]==null)continue;const prev=S.rated[k]||0;if(R[k]<prev)R[k]=prev;else S.rated[k]=R[k]}
  const vals=['power','shape','kick','engine','grit'].map(k=>R[k]).filter(v=>v!=null);
  R.ovr=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;
  return R;
}
function tierOf(ovr){if(ovr==null||ovr<40)return 0;if(ovr<60)return 1;if(ovr<80)return 2;return 3}

/* ================= GEMS ================= */
function checkGems(){
  const got=[];const has=k=>!!S.badges[k];const award=k=>{if(!has(k)){S.badges[k]=today();got.push(k)}};
  const n=S.sessions.length,ko=totalKOs();
  if(n>=1)award('first_w');if(ko>=1)award('first_ko');if(n>=10)award('w10');if(ko>=5)award('ko5');
  if(bestWrapStreak()>=4)award('wrap4');if(n>=24)award('w24');if(ko>=15)award('ko15');
  for(const s of S.sessions)for(const id in (s.ex||{})){const e=s.ex[id];if(e.lvl>0&&(e.sets||[]).some(x=>x.done&&+x.w>=S.profile.maxDb))award('ceiling')}
  const kk=[...S.kick].sort((a,b)=>a.d<b.d?-1:1);if(kk.length>=2&&(kk[kk.length-1].l+kk[kk.length-1].r)>(kk[0].l+kk[0].r))award('kick');
  const ms=[...S.meas].filter(m=>m.waist&&m.hips).sort((a,b)=>a.d<b.d?-1:1);if(ms.length>=2&&(ms[0].waist/ms[0].hips)-(ms[ms.length-1].waist/ms[ms.length-1].hips)>=0.02)award('shape');
  const fns=S.fights.filter(f=>f.kind==='fn');if(fns.length>=1)award('fn1');if(fns.length>=2||fns.some(f=>weekOf(f.d)>=12))award('fn2');
  return got;
}

function suggestion(id,exd,light){
  const ex=EX[id];const last=lastOf(id,S.active&&S.active.id);const lvl=S.levels[id]||0;
  if(!last){if(ex.type==='db')return {txt:t('firstTime',{lo:ex.reps[0],hi:ex.reps[1]})};if(ex.type==='band')return {txt:t('firstBand',{lo:ex.reps[0],hi:ex.reps[1]})};return {txt:t('firstBw',{lo:ex.reps[0],hi:ex.reps[1]})}}
  const done=(last.e.sets||[]).filter(s=>s.done);const top=ex.reps[1];
  const allTop=done.length&&done.every(s=>setReps(ex,s)>=top);const easy=(last.e.rir!=null&&last.e.rir>=3);
  const minReps=Math.min(...done.map(s=>setReps(ex,s)));
  if(light)return {txt:t('aimLight')};
  if(ex.type==='db'){
    const w=Math.max(...done.map(s=>+s.w||0));
    if(allTop||easy){
      if(w<S.profile.maxDb){const nw=Math.min(S.profile.maxDb,w+(w<5?1:2));return {txt:t('aimUp',{w:nw}),w:nw}}
      const steps=ex.ladder||[];if(lvl<steps.length)return {txt:t('aimLevel',{w,s:tx(LADDER[steps[lvl]])}),lvl:true,w};
      return {txt:t('aimSame',{r:minReps+1}),w};
    }
    if(minReps<ex.reps[0])return {txt:t('aimHold'),w};
    return {txt:t('aimSame',{r:minReps+1}),w};
  }
  if(ex.type==='band'){const b=Math.max(...done.map(s=>+s.b||0));const maxB=BANDS[ex.band].length-1;
    if((allTop||easy)&&b<maxB)return {txt:t('aimBandUp',{b:tx(BANDS[ex.band][b+1])}),b:b+1};
    return {txt:t('aimSame',{r:minReps+1}),b};}
  return {txt:t('aimSame',{r:Math.min(minReps+1,top+10)})};
}
function ghostFor(id,kind,w){
  if(w<7)return null;const gw=w-6;
  const s=sessionsSorted().find(x=>x.kind===kind&&weekOf(x.d)===gw&&x.ex&&x.ex[id]);
  if(!s)return null;return {w:gw,e:s.ex[id],work:workOf(id,s.ex[id])};
}

  if(ex.type==='db')w+=effLoad(id,st.w)*reps*(1+0.06*(exd.lvl||0));else if(ex.type==='band')w+=((+st.b||0)+1)*5*reps;else w+=reps}return w}

function bmr(){const p=S.profile;return 10*(+p.weight||61)+6.25*(+p.height||159)-5*(+p.age||24)-161}
function curWeight(){const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);return w.length?w[w.length-1].kg:+S.profile.weight||61}
function foodDayKcal(d){return (S.food[d]||[]).reduce((a,x)=>a+(+x.k||0),0)}
function foodDayProt(d){return (S.food[d]||[]).reduce((a,x)=>a+(+x.p||0),0)}
function adaptiveTDEE(){
  const from=addDays(today(),-28);const days=Object.keys(S.food).filter(d=>d>=from&&d<today()&&foodDayKcal(d)>=800);
  const ws=S.weights.filter(w=>w.d>=from&&!w.cyc).sort((a,b)=>a.d<b.d?-1:1);
  if(days.length<10||ws.length<4||daysBetween(ws[0].d,ws[ws.length-1].d)<14)return null;
  const avgIn=days.reduce((a,d)=>a+foodDayKcal(d),0)/days.length;
  const xs=ws.map(w=>daysBetween(ws[0].d,w.d)),ys=ws.map(w=>w.kg);const mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});const slope=den?num/den:0;
  return Math.round(avgIn-slope*7700);
}
function targets(){
  const formula=Math.round(bmr()*1.55);const ad=adaptiveTDEE();const tdee=ad||formula;
  const f={recomp:.9,gain:1.07,cut:.8}[S.profile.mode]||.9;
  const kcal=Math.max(1300,Math.round(tdee*f/10)*10);const w=curWeight();
  const p=Math.round(w*2/5)*5,fat=Math.round(w*.8),c=Math.max(0,Math.round((kcal-p*4-fat*9)/4));
  return {kcal,p,fat,c,tdee,formula,adaptive:ad};
}
function parseFood(text){
  const out=[];const segs=String(text).toLowerCase().replace(/½/g,'0.5').replace(/¼/g,'0.25').split(/,|;|\+|\n|\sand\s|\sі\s|\sта\s|\sз\s/);
  for(let seg of segs){seg=seg.trim();if(!seg)continue;
    let qty=null;let m=seg.match(/(\d+)\s*\/\s*(\d+)/);if(m){qty=+m[1]/+m[2];seg=seg.replace(m[0],' ')}
    else{m=seg.match(/(\d+(?:[.,]\d+)?)/);if(m){qty=parseFloat(m[1].replace(',','.'));seg=seg.replace(m[0],' ')}}
    if(qty==null&&/\b(half|пів|половина)\b/.test(seg))qty=.5;
    let unit=null;for(const u in UNITS){for(const a of UNITS[u]){const re=new RegExp('(^|[^a-zа-яіїєґ])'+a.replace('.','\\.')+'(?=$|[^a-zа-яіїєґ])');if(re.test(seg)){unit=u;seg=seg.replace(re,' ');break}}if(unit)break}
    let best=null,bl=0;for(const f of FOODS){for(const a of f[0]){if(seg.includes(a)&&a.length>bl){best=f;bl=a.length}}}
    const name=seg.replace(/\s+/g,' ').trim();
    if(!best){out.push({unknown:true,n:name||text,q:qty,u:unit});continue}
    let g;if(unit==='g'||unit==='ml')g=qty||100;else if(unit&&best[3][unit])g=(qty||1)*best[3][unit];else if(best[4]==='g'&&!unit)g=qty&&qty>10?qty:(qty||1)*(best[3].cup||50);else g=(qty||1)*(best[3][best[4]]||100);
    out.push({n:L()==='ua'?(best[0].find(a=>/[а-яіїєґ]/.test(a))||best[0][0]):best[0][0],g:Math.round(g),k:Math.round(g*best[1]/100),p:r1(g*best[2]/100)});
  }
  return out;
}

function nextPeriod(){

  if(p.length){let len=30;if(p.length>=2){const ds=[];for(let i=1;i<p.length;i++)ds.push(daysBetween(p[i-1],p[i]));const ok=ds.filter(x=>x>=20&&x<=40);if(ok.length)len=Math.round(ok.reduce((a,b)=>a+b)/ok.length)}
    next=addDays(p[p.length-1],len);while(next<addDays(today(),-3))next=addDays(next,len);}
  else{const d=new Date();const day=S.profile.cycleDay||25;let c=new Date(d.getFullYear(),d.getMonth(),day);if(dstr(c)<addDays(today(),-3))c=new Date(d.getFullYear(),d.getMonth()+1,day);next=dstr(c)}

function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function bell(times=1,gap=.42){const ac=audio();if(!ac)return;const now=ac.currentTime;
  for(let i=0;i<times;i++){const t0=now+i*gap;const master=ac.createGain();master.gain.setValueAtTime(.0001,t0);master.gain.exponentialRampToValueAtTime(.55,t0+.005);master.gain.exponentialRampToValueAtTime(.0001,t0+1.9);master.connect(ac.destination);
    [[740,1],[2042,.5],[3996,.25],[6608,.12]].forEach(([f,a])=>{const o=ac.createOscillator();const g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=a;o.connect(g);g.connect(master);o.start(t0);o.stop(t0+2)})}

function b64u(bytes){let s='';const ch=0x8000;for(let i=0;i<bytes.length;i+=ch)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+ch));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

  return 'j1.'+b64u(bytes)}
async function unpack(str){str=String(str).trim().replace(/^.*#sync=/,'').replace(/\s+/g,'');const [v,data]=[str.slice(0,3),str.slice(3)];const bytes=unb64u(data);
  if(v==='z1.'){const ds=new DecompressionStream('deflate-raw');const st=new Blob([bytes]).stream().pipeThrough(ds);return JSON.parse(await new Response(st).text())}
  if(v==='j1.')return JSON.parse(new TextDecoder().decode(bytes));throw new Error('bad')}

function mergeData(o){

  S.sessions=byKey(S.sessions,o.s,'id');S.weights=byKey(S.weights,o.w,'d');S.meas=byKey(S.meas,o.m,'d');S.kick=byKey(S.kick,o.k,'d');S.fights=byKey(S.fights,o.f,'id');

     ${base?`<div class="sub">${t('vsBaseline')}</div>`:''}${gems.map(g=>`<div class="sub" style="color:#CDB8FF">💎 ${t('newGem',{g:t('gem_'+g)})}</div>`).join('')}
     <div class="btns" style="width:100%;max-width:360px;margin-top:18px"><button class="btn" style="background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.15)" data-x>${t('close')}</button><button class="btn wa" data-send>${t('sendCoach')}</button></div>`;
    confetti(d,40);d.querySelector('[data-x]').onclick=()=>{d.remove();render()};
    d.querySelector('[data-send]').onclick=async()=>{const lines=[`🏆 ${CLIENT} · ${kind==='wi'?'Weigh-in test':'Fight Night'} · ${f.d}`,`Hip thrust (${f.r.w} kg): ${f.r.ht??'–'} reps`,`Push-ups: ${f.r.pu??'–'}`,`Single-leg bridge L/R: ${f.r.kl??'–'}/${f.r.kr??'–'}`,`Plank: ${f.r.pl??'–'} s`];try{lines.push('','Sync: '+await syncLink())}catch(e){}openWA(lines.join('\n'))};
    render()};
}
/* ================= REPORTS ================= */
function reportText(kind){
  const td=today();const from=kind==='day'?td:kind==='week'?addDays(td,-6):addDays(td,-29);const ss=sessionsSorted().filter(s=>s.d>=from&&s.d<=td);
  const lng=S.lang;S.lang='en';
  const lines=[`📊 ${CLIENT} · ${kind==='day'?'Today':kind==='week'?'Last 7 days':'Last 30 days'} (${from} → ${td})`];
  const home=ss.filter(s=>homeKinds(s.kind)),ring=ss.filter(s=>s.kind==='ring');
  lines.push(`Sessions: ${ss.length} (home ${home.length}, ring ${ring.length}) · hard sets ${ss.reduce((a,s)=>a+hardSets(s),0)} · glute sets ${ss.reduce((a,s)=>a+gluteSets(s),0)} · KO ${ss.reduce((a,s)=>a+(s.prs||0),0)}`);
  for(const s of ss){lines.push(`— ${s.d} ${sessTitle(s)}${s.dur?` · ${s.dur} min`:''}${s.feel?` · ${s.feel}`:''}${s.ring&&s.ring.rpe?` · RPE ${s.ring.rpe}`:''}${s.light?' · lighter':''}`);
    for(const id in (s.ex||{})){const e=s.ex[id];lines.push(`   ${EX[id].en}: ${fmtSets(id,e)}${e.rest==null?'':''}${e.ko?' 🏆':''}`)}}
  const ws=S.weights.filter(w=>w.d>=from).sort((a,b)=>a.d<b.d?-1:1);if(ws.length)lines.push(`Weight: ${ws.map(w=>w.kg+(w.cyc?'ᴾ':'')).join(', ')} kg`);
  const ms=S.meas.filter(m=>m.d>=from);if(ms.length){const m=ms[ms.length-1];lines.push(`Measurements ${m.d}: waist ${m.waist||'–'} · hips ${m.hips||'–'} · thigh ${m.thigh||'–'}${m.waist&&m.hips?` · WHR ${(m.waist/m.hips).toFixed(3)}`:''}`)}
  const fd=Object.keys(S.food).filter(d=>d>=from&&d<=td&&foodDayKcal(d)>0);if(fd.length){lines.push(`Food logged ${fd.length} day(s): avg ${Math.round(fd.reduce((a,d)=>a+foodDayKcal(d),0)/fd.length)} kcal · ${Math.round(fd.reduce((a,d)=>a+foodDayProt(d),0)/fd.length)} g protein`)}
  const pm=Object.keys(S.pmeals).filter(d=>d>=from);if(pm.length)lines.push(`Protein meals: ${pm.map(d=>S.pmeals[d]).join(', ')}`);
  const T_=targets();lines.push(`Target: ${T_.kcal} kcal · ${T_.p} g protein (${S.profile.mode})${T_.adaptive?` · real burn ~${T_.adaptive}`:''}`);
  const pr=S.periods.filter(d=>d>=from);if(pr.length)lines.push(`Period started: ${pr.join(', ')}`);
  const R=computeRatings();lines.push(`Card: OVR ${R.ovr??'–'} · POWER ${R.power??'–'} · SHAPE ${R.shape??'–'} · KICK ${R.kick??'–'} · ENGINE ${R.engine??'–'} · GRIT ${R.grit??'–'}`);
  lines.push(`Camp week ${curWeek()} · wraps ${wrapsCount()}/12 · record ${S.sessions.length}–0 · ${totalKOs()} KO · shadow rounds ${S.shadow||0}`);
  S.lang=lng;return lines.join('\n');
}

function addFood(meal){
  const inp=$('#food_'+meal);const txt=inp.value.trim();if(!txt)return;const items=parseFood(txt);const known=items.filter(x=>!x.unknown),unk=items.filter(x=>x.unknown);
  const commit=(extraK,extraP)=>{const d=today();(S.food[d]=S.food[d]||[]).push({id:uid(),meal,txt,k:Math.round(known.reduce((a,x)=>a+x.k,0)+extraK),p:r1(known.reduce((a,x)=>a+x.p,0)+extraP),items:known});save();renderFuel()};
  if(!unk.length){commit(0,0);return}
  openSheet(`<h2>🍽️ ${t('foodLog')}</h2>${known.length?`<div class="small mb8">✓ ${known.map(x=>esc(x.n)+' '+x.g+'g · '+x.k+' kcal').join('<br>✓ ')}</div>`:''}
   ${unk.map((u,i)=>`<div class="q">${esc(t('unknownFood',{x:u.n}))}</div><div class="grid2"><input class="inp" id="uk${i}" type="number" inputmode="numeric" placeholder="kcal"><input class="inp" id="up${i}" type="number" inputmode="decimal" placeholder="${t('protein')} g"></div>`).join('')}
   <button class="btn pri block mt16" id="ukSave">${t('save')}</button>`,(el,close)=>{$('#ukSave',el).onclick=()=>{let k=0,p=0;unk.forEach((u,i)=>{k+=+$('#uk'+i,el).value||0;p+=+$('#up'+i,el).value||0});close();commit(k,p)}});
}

/* ================= NAV / RENDER ================= */
function go(v){UI.tab=v;for(const b of $$('.tab'))b.classList.toggle('on',b.dataset.v===v);for(const s of $$('.view'))s.classList.toggle('on',s.id==='v-'+v);if(v!=='camp'){clearTimeout(UI.typeTimer);clearInterval(UI.rotTimer)}render();window.scrollTo({top:0,behavior:'auto'})}
function render(){applyTheme();applyLang();
  const v=UI.tab;if(v==='camp')renderCamp();else if(v==='train')renderTrain();else if(v==='progress')renderProgress();else if(v==='fuel')renderFuel();else renderMore();
  if(v!=='train'){clearInterval(sessTimer)}
}

/* ================= ACTIONS ================= */
document.addEventListener('click',async e=>{
  const tab=e.target.closest('.tab');if(tab){go(tab.dataset.v);return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,k=b.dataset.k,id=b.dataset.id;
  switch(a){
    case 'why':showWhy(k);break;
    case 'rating':ratingInfo(k);break;
    case 'gem':{const on=S.badges[k];toast(on?`💎 ${t('gem_'+k)} · ${fmtD(on)}`:`🔒 ${t('lockedGem',{g:t('gem_'+k)})}`);break}
    case 'start':startFlow(b.dataset.r,+b.dataset.m);break;
    case 'resume':go('train');break;
    case 'leave':stopCorner();clearInterval(sessTimer);UI.tab='camp';go('camp');break;
    case 'cancelActive':if(await confirmBox(t('confirmCancel'))){S.active=null;stopCorner();save();render()}break;
    case 'logRing':logRing();break;
    case 'shadow':shadowFlow();break;
    case 'kick':kickTest();break;
    case 'fight':fightFlow(k);break;
    case 'psub':UI.psub=k;renderProgress();break;
    case 'curve':UI.curve=k;renderProgress();break;
    case 'poster':makePoster();break;
    case 'saveMeas':{const g=i=>{const v=$('#'+i).value;return v===''?null:+v};const m={d:today(),ts:Date.now(),waist:g('mW'),hips:g('mH'),thigh:g('mT'),neck:g('mN')};
      if(m.waist==null&&m.hips==null&&m.thigh==null&&m.neck==null){toast(L_ua()?'Введи хоча б один обхват.':'Enter at least one measurement.');return}
      const prev=S.meas.find(x=>x.d===m.d);if(prev){for(const kk of ['waist','hips','thigh','neck'])if(m[kk]==null)m[kk]=prev[kk];S.meas=S.meas.filter(x=>x.d!==m.d)}S.meas.push(m);const gm=checkGems();save();toast(t('saved'));if(gm.length)setTimeout(()=>toast('💎 '+t('newGem',{g:t('gem_'+gm[0])})),2300);renderProgress();break}
    case 'saveWeight':{const v=+$('#wKg').value;if(!v||v<30||v>200){toast(L_ua()?'Введи вагу в кг.':'Enter your weight in kg.');return}S.weights=S.weights.filter(w=>w.d!==today());S.weights.push({d:today(),kg:r1(v),cyc:inPeriodWindow(),ts:Date.now()});save();toast(t('saved'));renderProgress();break}
    case 'delWeight':if(await confirmBox(t('deleteQ'))){S.weights=S.weights.filter(w=>w.d!==k);save();renderProgress()}break;
    case 'periodStart':if(!S.periods.includes(today()))S.periods.push(today());for(const w of S.weights)if(daysBetween(today(),w.d)>=0&&daysBetween(today(),w.d)<=5)w.cyc=true;save();toast(t('periodSaved'));renderProgress();break;
    case 'mode':S.profile.mode=k;S.profile.ts=Date.now();save();renderFuel();break;
    case 'pmeal':{const d=today();S.pmeals[d]=clamp((S.pmeals[d]||0)+(+k),0,8);save();renderFuel();break}
    case 'foodAdd':addFood(k);break;
    case 'foodDel':{const d=today();S.food[d]=(S.food[d]||[]).filter(x=>x.id!==k);save();renderFuel();break}
    case 'quickMeal':{const o=MEALS[k][+b.dataset.i];const d=today();(S.food[d]=S.food[d]||[]).push({id:uid(),meal:k,txt:L_ua()?o.ua:o.en,k:o.k,p:o.p});if(o.p>=25)S.pmeals[d]=Math.min(8,(S.pmeals[d]||0)+1);save();toast(t('saved'));renderFuel();break}
    case 'saveDetails':{const p=S.profile;p.age=+$('#dAge').value||p.age;p.height=+$('#dH').value||p.height;p.weight=+$('#dW').value||p.weight;p.maxDb=+$('#dDb').value||p.maxDb;p.start=$('#dStart').value||p.start;p.cycleDay=clamp(+$('#dCyc').value||p.cycleDay,1,31);p.ts=Date.now();save();toast(t('saved'));break}
    case 'sync':{try{const link=await syncLink();openWA(`🔄 ${CLIENT} · my numbers\n${link}`)}catch(err){toast('Error')}break}
    case 'report':openWA(reportText(k));break;
    case 'copyBackup':{const code=await pack(exportData());try{await navigator.clipboard.writeText(code);toast(t('copied'))}catch(err){openSheet(`<h2>${t('backup')}</h2><div class="code-box">${esc(code)}</div><button class="btn block mt12" data-close>${t('ok')}</button>`)}break}
    case 'restore':{const v=$('#restoreBox').value.trim();if(!v)return;try{const o=await unpack(v);mergeData(o);toast(t('restored'));render()}catch(err){toast(t('badCode'))}break}
    case 'setLang':S.lang=k;save();render();break;
    case 'setTheme':S.theme=k||null;save();render();break;
    case 'saveCoach':setCoach({on:$('#cOn').checked,num:$('#cNum').value.trim()});toast(t('saved'));break;
    // session
    case 'finish':finishFlow();break;
    case 'prepToggle':{const kk=b.dataset.k;S.active[kk][id]=!S.active[kk][id];save();b.closest('.prep-item').classList.toggle('on');break}
    case 'demo':UI.demo[id]=!UI.demo[id];rerenderEx(id);break;
    case 'swap':swapFlow(id);break;
    case 'note':noteFlow(id);break;
    case 'setOk':setOk(id,+b.dataset.i);break;
    case 'rir':S.active.ex[id].rir=+b.dataset.v;save();rerenderEx(id);break;
    case 'levelUp':{const lv=(S.levels[id]||0)+1;S.levels[id]=lv;S.active.ex[id].lvl=lv;save();const step=EX[id].ladder[lv-1];toast('⬆️ '+t('levelNow',{n:lv})+': '+tx(LADDER[step]));const gm=checkGems();if(gm.length)setTimeout(()=>toast('💎 '+t('newGem',{g:t('gem_'+gm[0])})),2300);rerenderEx(id);break}
  }
});
$('#langBtn').onclick=()=>{S.lang=L()==='ua'?'en':'ua';save();render()};
$('#themeBtn').onclick=()=>{const dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;S.theme=dark?'light':'dark';save();render()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!S.theme)render()});
let rsz;addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(UI.tab==='progress')UI.psub==='stats'?drawStatsCharts():drawBodyCharts()},200)});

/* ================= SYNC LINK ON LOAD ================= */
async function checkSyncHash(){
  if(!location.hash.startsWith('#sync='))return;let o;try{o=await unpack(location.hash.slice(6))}catch(e){toast(t('badCode'));history.replaceState(null,'',location.pathname);return}
  const ss=(o.s||[]);const last=ss.map(s=>s.d).sort().pop();
  openSheet(`<h2>🔄 ${t('syncTitle')}</h2><div class="small"><div class="list-row"><span class="grow">${t('sessions')}</span><b>${ss.length}</b></div><div class="list-row"><span class="grow">${L_ua()?'Останнє':'Latest'}</span><b>${last?fmtD(last):'–'}</b></div><div class="list-row"><span class="grow">${t('weight')}</span><b>${(o.w||[]).length}</b></div><div class="list-row"><span class="grow">${t('measures')}</span><b>${(o.m||[]).length}</b></div><div class="list-row"><span class="grow">KO</span><b>${ss.reduce((a,s)=>a+(s.prs||0),0)}</b></div></div>
   <div class="btns mt16"><button class="btn" data-close>${t('cancel')}</button><button class="btn pri" id="syncAdd">${t('syncAdd')}</button></div>`,(el,close)=>{$('#syncAdd',el).onclick=()=>{mergeData(o);close();toast(t('syncMerged'));render()}});
  history.replaceState(null,'',location.pathname);
}

/* ================= INIT ================= */
(function init(){
  if(!S.lang){const n=(navigator.language||'').toLowerCase();S.lang=n.startsWith('uk')?'ua':'en'}
  // clean an abandoned active round from a different day? keep it: user decides (Resume / Cancel)
  checkGems();save();render();checkSyncHash();
})();
</script>
</body></html>
